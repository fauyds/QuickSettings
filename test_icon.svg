<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Cyan Pill Gradient -->
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Violet Pill Gradient -->
    <linearGradient id="violetPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Slider Amber Gradient -->
    <linearGradient id="sliderAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Subtle Card Shadow / Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Solid App Background -->
  <rect width="1024" height="1024" fill="#101726" />

  <!-- Soft Ambient Glow behind Card -->
  <circle cx="512" cy="512" r="460" fill="url(#glowGrad)" />

  <!-- Main Squircle Control Panel Card -->
  <rect x="120" y="120" width="784" height="784" rx="180" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Top Status/Pill Notch Indicator -->
  <rect x="452" y="152" width="120" height="10" rx="5" fill="#475569" opacity="0.6" />

  <!-- ROW 1 - LEFT: Wi-Fi QS Tile -->
  <rect x="184" y="200" width="310" height="190" rx="75" fill="url(#cyanPill)" />
  <!-- Wi-Fi Waves -->
  <!-- Outer Arc -->
  <path d="M 274 270 A 90 90 0 0 1 404 270" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
  <!-- Middle Arc -->
  <path d="M 300 305 A 55 55 0 0 1 378 305" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
  <!-- Center Dot -->
  <circle cx="339" cy="340" r="14" fill="#FFFFFF" />

  <!-- ROW 1 - RIGHT: Bluetooth / Toggle QS Tile -->
  <rect x="530" y="200" width="310" height="190" rx="75" fill="url(#violetPill)" />
  <!-- Bluetooth Glyph -->
  <path d="M 685 240 L 685 350 M 685 240 L 730 270 L 655 315 L 730 320 L 685 350" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ROW 2 - LEFT: Flashlight / Torch Tile -->
  <rect x="184" y="420" width="310" height="165" rx="60" fill="#1E283D" stroke="#334155" stroke-width="3" />
  <!-- Flashlight Icon -->
  <path d="M 319 470 L 359 470 L 351 498 L 327 498 Z" fill="#38BDF8" />
  <path d="M 326 504 L 352 504 L 348 546 L 330 546 Z" fill="#94A3B8" />
  <circle cx="339" cy="462" r="5" fill="#38BDF8" />
  <line x1="324" y1="450" x2="316" y2="442" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="339" y1="446" x2="339" y2="435" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="354" y1="450" x2="362" y2="442" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />

  <!-- ROW 2 - RIGHT: Do Not Disturb / Moon Tile -->
  <rect x="530" y="420" width="310" height="165" rx="60" fill="#1E283D" stroke="#334155" stroke-width="3" />
  <!-- Crescent Moon Icon -->
  <path d="M 700 460 A 42 42 0 1 1 658 544 A 36 36 0 0 0 700 460 Z" fill="#E2E8F0" />

  <!-- ROW 3 - FULL WIDTH: M3 Brightness Slider -->
  <rect x="184" y="618" width="656" height="120" rx="60" fill="#161F2E" stroke="#2D3B50" stroke-width="3" />
  <!-- Active Slider Level -->
  <rect x="184" y="618" width="410" height="120" rx="60" fill="url(#sliderAmber)" />
  <!-- Sun Disk -->
  <circle cx="250" cy="678" r="22" fill="#FFFFFF" />
  <!-- Sun Rays -->
  <line x1="250" y1="644" x2="250" y2="636" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="712" x2="250" y2="720" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="216" y1="678" x2="208" y2="678" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="284" y1="678" x2="292" y2="678" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="226" y1="654" x2="220" y2="648" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="274" y1="702" x2="280" y2="708" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="226" y1="702" x2="220" y2="708" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="274" y1="654" x2="280" y2="648" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
</svg>
